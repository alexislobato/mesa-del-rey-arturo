<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-UVA Coaching & Consultants - La Mesa del Rey Arturo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #f8f9fa; 
            font-family: 'Lato', sans-serif; 
            color: #333333; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative Background Elements matching the user's screenshot */
        .bg-circle-1 {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 250px;
            height: 250px;
            background-color: #e2e0ea;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.7;
        }
        .bg-circle-2 {
            position: absolute;
            top: 60px;
            right: 80px;
            width: 120px;
            height: 120px;
            background-color: #fdf5d8;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.8;
        }
        .bg-circle-3 {
            position: absolute;
            bottom: -30px;
            left: 80px;
            width: 150px;
            height: 150px;
            background-color: #e2e0ea;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.7;
        }
        .bg-circle-4 {
            position: absolute;
            bottom: -50px;
            right: -30px;
            width: 280px;
            height: 280px;
            background-color: #fdf5d8;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.8;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            z-index: 10;
        }
        .logo-area {
            display: flex;
            flex-direction: column;
        }
        .logo-img {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #1a1a2e;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .logo-img span {
            color: #6c5ce7;
        }
        .logo-subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
        }
        .header-title-area {
            text-align: center;
        }
        .header-title-area h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .header-title-area p {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }

        /* Main Container / Login Box */
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            z-index: 10;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .login-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fafafa;
        }
        .form-control:focus {
            border-color: #1a1a2e;
            background-color: #fff;
        }
        .btn-submit {
            width: 100%;
            background-color: #1a1a2e;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #2c2c4a;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            font-size: 12px;
            color: #444;
            z-index: 10;
            background: transparent;
        }
        footer span {
            font-weight: 700;
            color: #1a1a2e;
        }

        @media(max-width: 768px) {
            header { flex-direction: column; gap: 15px; padding: 20px; text-align: center; }
            .header-title-area { display: none; }
        }
    </style>
</head>
<body>

    <!-- Decorative background elements -->
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-circle-3"></div>
    <div class="bg-circle-4"></div>

    <!-- Header Section -->
    <header>
        <div class="logo-area">
            <div class="logo-img">h·uva<span>.</span></div>
            <div class="logo-subtitle">Coaching & Consultants</div>
        </div>
        <div class="header-title-area">
            <h1>La Mesa del Rey Arturo</h1>
            <p>Dinámica de Feedback 360°</p>
        </div>
        <div style="width: 140px;"></div> <!-- Spacer for balance -->
    </header>

    <!-- Main Content / Login Form -->
    <div class="main-wrapper">
        <div class="login-card">
            <h2>Acceso Administrativo</h2>
            <form onsubmit="event.preventDefault(); alert('Bienvenido al sistema H-UVA 360°');">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" class="form-control" placeholder="usuario@h-uva.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        hvazquez@h-uva.com | 33 1340 4958<br>
        H-UVA Coaching & Consulting
    </footer>

</body>
</html>
